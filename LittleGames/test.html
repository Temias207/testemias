<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5 Gewinnt - Unendliches Spielfeld</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Prevent selection and browser gestures on mobile devices */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      touch-action: none;
    }

    /* Canvas styling ensuring crisp presentation and non-interfering touch handling */
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none bg-slate-900 text-slate-100">

  <!-- Top UI Bar -->
  <div class="absolute top-4 left-4 right-4 z-10 pointer-events-none flex justify-between items-start">
    <div class="bg-slate-800/90 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-slate-700/50 pointer-events-auto max-w-xs sm:max-w-md">
      <h1 class="text-xl font-bold bg-gradient-to-r from-red-500 via-amber-400 to-yellow-400 bg-clip-text text-transparent">
        5 Gewinnt (Unendlich)
      </h1>
      <div class="mt-2 flex items-center space-x-3">
        <span class="text-sm font-medium text-slate-300">Am Zug:</span>
        <div id="player-indicator" class="flex items-center space-x-2 px-3 py-1 rounded-full bg-red-500/20 border border-red-500/40 text-red-400 font-semibold text-sm transition-all duration-300">
          <span id="player-dot" class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
          <span id="player-text">Spieler 1 (Rot)</span>
        </div>
      </div>
    </div>

    <!-- Controls / Quick Help -->
    <div class="hidden sm:flex flex-col space-y-2 bg-slate-800/90 backdrop-blur-md p-3 rounded-2xl shadow-xl border border-slate-700/50 text-xs text-slate-400">
      <div class="flex items-center space-x-2">
        <span class="px-1.5 py-0.5 rounded bg-slate-700 text-slate-200 font-mono">Mausrad</span>
        <span>/</span>
        <span class="px-1.5 py-0.5 rounded bg-slate-700 text-slate-200 font-mono">2 Finger</span>
        <span>= Zoomen</span>
      </div>
      <div class="flex items-center space-x-2">
        <span class="px-1.5 py-0.5 rounded bg-slate-700 text-slate-200 font-mono">Ziehen</span>
        <span>= Spielfeld bewegen</span>
      </div>
      <div class="flex items-center space-x-2">
        <span class="px-1.5 py-0.5 rounded bg-slate-700 text-slate-200 font-mono">Tippen</span>
        <span>= Stein setzen</span>
      </div>
    </div>
  </div>

  <!-- Bottom Floating Action Buttons -->
  <div class="absolute bottom-6 right-6 z-10 flex flex-col space-y-3">
    <button id="btn-recenter" class="p-3 bg-slate-800/90 hover:bg-slate-700/90 active:scale-95 text-slate-200 rounded-full shadow-lg border border-slate-700/50 transition-all flex items-center justify-center group" title="Zentrieren">
      <svg class="w-6 h-6 group-hover:rotate-45 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 12h3m14 0h3M12 2v3m0 14v3" />
      </svg>
    </button>
    <button id="btn-reset" class="p-3 bg-slate-800/90 hover:bg-red-900/40 active:scale-95 text-slate-200 hover:text-red-400 rounded-full shadow-lg border border-slate-700/50 transition-all flex items-center justify-center" title="Neustart">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </button>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const playerIndicator = document.getElementById('player-indicator');
    const playerDot = document.getElementById('player-dot');
    const playerText = document.getElementById('player-text');
    const btnRecenter = document.getElementById('btn-recenter');
    const btnReset = document.getElementById('btn-reset');

    // Grid data store: Map key "x,y" -> player ID (1 or 2)
    const gridData = new Map();
    let currentPlayer = 1;

    // Grid Configuration
    const BASE_GRID_SIZE = 40; // Base cell size in pixels at scale = 1
    let scale = 1;
    let offsetX = window.innerWidth / 2;
    let offsetY = window.innerHeight / 2;

    // Pointer / Drag State Variables
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let draggedDistance = 0;
    let lastTouchDistance = null;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function draw() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      // Clear Screen
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      // Apply Camera Viewport Transformation
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Calculate visible bounds in grid coordinates (Culling)
      const minCol = Math.floor((-offsetX / scale) / BASE_GRID_SIZE) - 1;
      const maxCol = Math.ceil(((width - offsetX) / scale) / BASE_GRID_SIZE) + 1;
      const minRow = Math.floor((-offsetY / scale) / BASE_GRID_SIZE) - 1;
      const maxRow = Math.ceil(((height - offsetY) / scale) / BASE_GRID_SIZE) + 1;

      // 1. Draw Grid Lines
      ctx.strokeStyle = '#334155'; // Tailwind Slate-700
      ctx.lineWidth = 1 / scale;   // Keep line thickness constant

      ctx.beginPath();
      for (let x = minCol; x <= maxCol; x++) {
        ctx.moveTo(x * BASE_GRID_SIZE, minRow * BASE_GRID_SIZE);
        ctx.lineTo(x * BASE_GRID_SIZE, maxRow * BASE_GRID_SIZE);
      }
      for (let y = minRow; y <= maxRow; y++) {
        ctx.moveTo(minCol * BASE_GRID_SIZE, y * BASE_GRID_SIZE);
        ctx.lineTo(maxCol * BASE_GRID_SIZE, y * BASE_GRID_SIZE);
      }
      ctx.stroke();

      // 2. Draw Center Marker (Origin 0,0)
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2 / scale;
      ctx.beginPath();
      ctx.arc(BASE_GRID_SIZE / 2, BASE_GRID_SIZE / 2, 4 / scale, 0, Math.PI * 2);
      ctx.stroke();

      // 3. Draw Played Stones
      gridData.forEach((player, key) => {
        const [gx, gy] = key.split(',').map(Number);
        const centerX = gx * BASE_GRID_SIZE + BASE_GRID_SIZE / 2;
        const centerY = gy * BASE_GRID_SIZE + BASE_GRID_SIZE / 2;
        const radius = BASE_GRID_SIZE * 0.38;

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        
        if (player === 1) {
          ctx.fillStyle = '#ef4444'; // Red 500
          ctx.shadowColor = 'rgba(239, 68, 68, 0.5)';
        } else {
          ctx.fillStyle = '#eab308'; // Yellow 500
          ctx.shadowColor = 'rgba(234, 179, 8, 0.5)';
        }
        
        ctx.shadowBlur = 10 / scale;
        ctx.fill();
        ctx.shadowBlur = 0; // Reset shadow
      });

      ctx.restore();
    }

    // Coordinate conversion: Screen Pixel -> Grid Coordinates
    function screenToGrid(screenX, screenY) {
      const worldX = (screenX - offsetX) / scale;
      const worldY = (screenY - offsetY) / scale;
      return {
        x: Math.floor(worldX / BASE_GRID_SIZE),
        y: Math.floor(worldY / BASE_GRID_SIZE)
      };
    }

    // Precise touch/mouse coordinates accounting for canvas offset
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Switch turn UI indicator
    function switchPlayer() {
      currentPlayer = currentPlayer === 1 ? 2 : 1;
      if (currentPlayer === 1) {
        playerIndicator.className = 'flex items-center space-x-2 px-3 py-1 rounded-full bg-red-500/20 border border-red-500/40 text-red-400 font-semibold text-sm transition-all duration-300';
        playerDot.className = 'w-3 h-3 rounded-full bg-red-500 animate-pulse';
        playerText.textContent = 'Spieler 1 (Rot)';
      } else {
        playerIndicator.className = 'flex items-center space-x-2 px-3 py-1 rounded-full bg-yellow-500/20 border border-yellow-500/40 text-yellow-400 font-semibold text-sm transition-all duration-300';
        playerDot.className = 'w-3 h-3 rounded-full bg-yellow-500 animate-pulse';
        playerText.textContent = 'Spieler 2 (Gelb)';
      }
    }

    // Place stone at specific cell
    function placeStone(screenX, screenY) {
      const gridPos = screenToGrid(screenX, screenY);
      const key = `${gridPos.x},${gridPos.y}`;

      if (!gridData.has(key)) {
        gridData.set(key, currentPlayer);
        switchPlayer();
        draw();
      }
    }

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.12;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
      if (newScale < 0.15 || newScale > 8) return;

      offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
      offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
      scale = newScale;

      draw();
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      const coords = getCanvasCoords(e);
      startX = coords.x - offsetX;
      startY = coords.y - offsetY;
      draggedDistance = 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const coords = getCanvasCoords(e);
        const dx = coords.x - (startX + offsetX);
        const dy = coords.y - (startY + offsetY);
        draggedDistance += Math.abs(dx) + Math.abs(dy);

        offsetX = coords.x - startX;
        offsetY = coords.y - startY;
        draw();
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isDragging) {
        if (draggedDistance < 6) {
          const coords = getCanvasCoords(e);
          placeStone(coords.x, coords.y);
        }
        isDragging = false;
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        const coords = getCanvasCoords(e);
        startX = coords.x - offsetX;
        startY = coords.y - offsetY;
        draggedDistance = 0;
      } else if (e.touches.length === 2) {
        isDragging = false;
        lastTouchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault(); // Prevent browser bouncing / pull-to-refresh on iOS

      if (e.touches.length === 1 && isDragging) {
        const coords = getCanvasCoords(e);
        const dx = coords.x - (startX + offsetX);
        const dy = coords.y - (startY + offsetY);
        draggedDistance += Math.abs(dx) + Math.abs(dy);

        offsetX = coords.x - startX;
        offsetY = coords.y - startY;
        draw();
      } else if (e.touches.length === 2) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );

        if (lastTouchDistance) {
          const zoomFactor = currentDistance / lastTouchDistance;
          const newScale = scale * zoomFactor;

          if (newScale >= 0.15 && newScale <= 8) {
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

            offsetX = midX - (midX - offsetX) * (newScale / scale);
            offsetY = midY - (midY - offsetY) * (newScale / scale);
            scale = newScale;
            draw();
          }
        }
        lastTouchDistance = currentDistance;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      lastTouchDistance = null;

      if (isDragging && draggedDistance < 10 && e.changedTouches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        const touch = e.changedTouches[0];
        const screenX = touch.clientX - rect.left;
        const screenY = touch.clientY - rect.top;

        placeStone(screenX, screenY);
      }
      isDragging = false;
    });

    btnRecenter.addEventListener('click', () => {
      scale = 1;
      offsetX = window.innerWidth / 2;
      offsetY = window.innerHeight / 2;
      draw();
    });

    btnReset.addEventListener('click', () => {
      gridData.clear();
      currentPlayer = 1;
      playerIndicator.className = 'flex items-center space-x-2 px-3 py-1 rounded-full bg-red-500/20 border border-red-500/40 text-red-400 font-semibold text-sm transition-all duration-300';
      playerDot.className = 'w-3 h-3 rounded-full bg-red-500 animate-pulse';
      playerText.textContent = 'Spieler 1 (Rot)';
      draw();
    });

    // Initialize Canvas on Start
    resizeCanvas();
  </script>
</body>
</html>
